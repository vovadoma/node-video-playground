# Publishes the docs site (scripts/build-site.ts → site/) to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Build and deployment → Source: GitHub Actions.
# Screenshots and clips are captured locally (npm run capture) and committed in docs/examples/ —
# CI has no camera, screen or time to run every example.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read          # deploy-pages ≥ v4

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22        # Node 20 reached end of life in April 2026; the project needs ≥ 20
          cache: npm
      - run: npm ci
      - run: npm run site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
