<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sample Player</title>
  <style>
    :root {
      --bg: #ffffff; --panel: #f9fafb; --border: #e5e7eb; --text: #111827; --muted: #6b7280;
      --accent: #2563eb; --accent-bg: #eff6ff; --yes: #15803d; --maybe: #b45309; --no: #b91c1c;
      --code-bg: #f3f4f6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17; --panel: #111827; --border: #1f2937; --text: #e5e7eb; --muted: #9ca3af;
        --accent: #60a5fa; --accent-bg: #172554; --yes: #4ade80; --maybe: #fbbf24; --no: #f87171;
        --code-bg: #1f2937;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      display: grid; grid-template-columns: minmax(280px, 380px) 1fr; height: 100vh;
    }
    aside { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
    .toolbar { padding: 12px; border-bottom: 1px solid var(--border); display: grid; gap: 8px; }
    .toolbar input[type=search] {
      width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--text); font: inherit;
    }
    .toolbar .row { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
    .toolbar button { font: inherit; font-size: 12px; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 5px; padding: 2px 8px; cursor: pointer; }
    #list { overflow-y: auto; flex: 1; padding-bottom: 16px; }
    details > summary {
      position: sticky; top: 0; background: var(--panel); padding: 8px 12px; cursor: pointer;
      font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .item {
      display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: start;
      padding: 6px 12px; cursor: pointer; border-left: 3px solid transparent;
    }
    .item:hover { background: var(--accent-bg); }
    .item.active { background: var(--accent-bg); border-left-color: var(--accent); }
    .item .name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; word-break: break-all; }
    .item .meta { color: var(--muted); font-size: 11.5px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; }
    .dot.yes { background: var(--yes); } .dot.maybe { background: var(--maybe); } .dot.no { background: var(--no); }

    main { overflow-y: auto; padding: 24px; min-width: 0; }
    .empty { color: var(--muted); margin-top: 20vh; text-align: center; }
    h1 { font-size: 16px; margin: 0 0 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    .stage { background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; }
    .stage video { width: 100%; max-height: 65vh; display: block; }
    .stage.audio { background: var(--panel); border: 1px solid var(--border); padding: 24px; }
    .stage.audio audio { width: 100%; }
    .notice {
      border: 1px solid var(--border); border-radius: 8px; padding: 16px; background: var(--panel);
    }
    .notice.no { border-color: var(--no); }
    .notice.maybe { border-color: var(--maybe); margin-top: 12px; }
    .notice p { margin: 0 0 8px; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
    pre { background: var(--code-bg); padding: 12px; border-radius: 6px; overflow-x: auto; margin: 0; }
    .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 16px 0; }
    .fact { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
    .fact b { display: block; font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
    .badge.yes { color: var(--yes); } .badge.maybe { color: var(--maybe); } .badge.no { color: var(--no); }
    details.raw summary { cursor: pointer; color: var(--muted); margin: 8px 0; }

    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); }
      main { padding: 16px; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="toolbar">
      <input id="q" type="search" placeholder="Filter by name or codec…" autocomplete="off">
      <div class="row">
        <label><input id="onlyPlayable" type="checkbox"> only playable</label>
        <span id="count"></span>
        <button id="refresh" title="Re-scan the samples folder">rescan</button>
      </div>
    </div>
    <div id="list"></div>
  </aside>
  <main id="main">
    <p class="empty">Loading catalog…</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
