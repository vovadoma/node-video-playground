<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="7" fill="var(--accent)"/>
          <rect x="7" y="18" width="5" height="7" rx="1" fill="#fff" opacity=".55"/>
          <rect x="13.5" y="13" width="5" height="12" rx="1" fill="#fff" opacity=".8"/>
          <rect x="20" y="8" width="5" height="17" rx="1" fill="#fff"/>
        </svg>
        <span class="brand-text">
          <strong>node-video-playground</strong>
          <small>Media library</small>
        </span>
      </a>
      <div class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 0 3.47 9.77l3.63 3.63 1.06-1.06-3.63-3.63A5.5 5.5 0 0 0 8.5 3Zm0 1.5a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
        <input id="q" type="search" placeholder="Search by name, codec, folder…" autocomplete="off">
      </div>
      <button id="refresh" class="btn btn-ghost" title="Re-scan the samples folder">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 0 1 6.32 4H14v1.5h4.5V4H17v1.9A8.5 8.5 0 1 0 18.5 10H17a7 7 0 1 1-7-7Z"/></svg>
        Rescan
      </button>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div id="envBanner" class="env-banner" role="status" hidden></div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 id="tabTitle">Video</h1>
        <p id="tabHint" class="muted"></p>
      </div>
      <p id="stats" class="muted"></p>
    </div>
    <div id="content"><p class="empty">Loading library…</p></div>
  </main>

  <dialog id="player" class="player">
    <header class="player-head">
      <div>
        <h2 id="playerTitle"></h2>
        <p id="playerPath" class="muted mono"></p>
      </div>
      <div class="player-actions">
        <a id="playerDownload" class="btn btn-ghost" download>Download</a>
        <button class="btn btn-icon" data-close aria-label="Close">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 4.4 4.5 4.5 4.5-4.5 1.1 1.1-4.5 4.5 4.5 4.5-1.1 1.1-4.5-4.5-4.5 4.5-1.1-1.1 4.5-4.5-4.5-4.5 1.1-1.1Z"/></svg>
        </button>
      </div>
    </header>
    <div id="playerStage" class="player-stage"></div>
    <div id="playerNote"></div>
    <dl id="playerFacts" class="facts"></dl>
    <details id="playerRaw" class="raw"><summary>ffprobe JSON</summary><pre></pre></details>
  </dialog>

  <!--
    Card template. app.js fills every [data-field] from a card model (see CARD_MODELS),
    so a new kind of card only needs a new model function — not new markup.
      data-field="x"        → textContent
      data-field="chips"    → one <li> per string
      data-field="badges"   → one <span class="badge badge-{tone}"> per {text, tone}
      data-slot="media"     → preview element (video frame / waveform / stream icon)
  -->
  <template id="tpl-card">
    <article class="card" tabindex="0">
      <div class="card-media" data-slot="media">
        <span class="card-duration" data-field="duration"></span>
        <span class="card-play" aria-hidden="true">
          <svg viewBox="0 0 20 20"><path d="M6.5 4.3v11.4a.5.5 0 0 0 .77.42l8.7-5.7a.5.5 0 0 0 0-.84l-8.7-5.7a.5.5 0 0 0-.77.42Z"/></svg>
        </span>
      </div>
      <div class="card-body">
        <h3 class="card-title" data-field="title"></h3>
        <p class="card-sub" data-field="subtitle"></p>
        <ul class="chips" data-field="chips"></ul>
      </div>
      <footer class="card-foot">
        <span data-field="meta"></span>
        <span class="badges" data-field="badges"></span>
      </footer>
    </article>
  </template>

  <!-- Example card: same filling rules as tpl-card (see renderExampleCard in app.js). -->
  <template id="tpl-example-card">
    <article class="card ex-card" tabindex="0">
      <div class="ex-card-head">
        <span class="ex-num" data-field="num"></span>
        <span class="badges" data-field="badges"></span>
      </div>
      <div class="card-body">
        <h3 class="card-title" data-field="title"></h3>
        <p class="ex-summary" data-field="summary"></p>
      </div>
      <footer class="card-foot">
        <code class="ex-cmd" data-field="command"></code>
        <span class="ex-open">Open →</span>
      </footer>
    </article>
  </template>

  <!-- Example page: description, run controls, live console, results, source. -->
  <template id="tpl-example-page">
    <section class="ex-page">
      <a class="back" href="#tab=examples">← All examples</a>
      <div class="ex-hero">
        <div class="ex-hero-text">
          <span class="ex-num" data-field="num"></span>
          <h2 data-field="title"></h2>
          <p data-field="summary"></p>
          <code class="ex-cmd" data-field="command"></code>
        </div>
        <div class="ex-controls">
          <label class="field" data-role="input-field">
            <span data-field="inputLabel"></span>
            <select data-role="input"></select>
          </label>
          <div class="ex-buttons">
            <button class="btn btn-primary" data-role="run">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 4.3v11.4a.5.5 0 0 0 .77.42l8.7-5.7a.5.5 0 0 0 0-.84l-8.7-5.7a.5.5 0 0 0-.77.42Z"/></svg>
              Run
            </button>
            <button class="btn" data-role="stop" hidden>
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="1.5"/></svg>
              Stop
            </button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Console</h3>
          <span class="run-status" data-role="status"></span>
        </div>
        <pre class="console" data-role="console"></pre>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Results</h3>
          <span class="muted" data-role="results-meta"></span>
        </div>
        <div class="panel-body" data-role="results"></div>
      </div>

      <details class="panel">
        <summary class="panel-head"><h3>Source</h3><span class="muted mono" data-field="fileName"></span></summary>
        <pre class="code" data-role="source"></pre>
      </details>
    </section>
  </template>

  <template id="tpl-section">
    <section class="section">
      <h2 class="section-title"><span data-field="title"></span><span class="count" data-field="count"></span></h2>
      <div class="grid"></div>
    </section>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
  <script src="app.js"></script>
  <script src="examples.js"></script>
</body>
</html>
