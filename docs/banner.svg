<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="node-video-playground" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .title { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 44px; font-weight: 600; fill: #111827; letter-spacing: -0.5px; }
    .sub   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; fill: #4b5563; }
    .tag   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #374151; }
    .lbl   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #6b7280; }
  </style>

  <rect width="1200" height="300" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="8" fill="none" stroke="#e5e7eb"/>
  <rect x="0" y="0" width="6" height="300" fill="#2563eb"/>

  <!-- icon: film frame -->
  <g transform="translate(64,78)">
    <rect x="0" y="0" width="144" height="144" rx="10" fill="#f3f4f6" stroke="#d1d5db"/>
    <rect x="24" y="30" width="96" height="60" rx="4" fill="#ffffff" stroke="#9ca3af"/>
    <path d="M64 46 L64 74 L88 60 Z" fill="#2563eb"/>
    <g fill="#d1d5db">
      <rect x="8" y="10" width="8" height="8" rx="1"/><rect x="8" y="30" width="8" height="8" rx="1"/><rect x="8" y="50" width="8" height="8" rx="1"/><rect x="8" y="70" width="8" height="8" rx="1"/><rect x="8" y="90" width="8" height="8" rx="1"/><rect x="8" y="110" width="8" height="8" rx="1"/><rect x="8" y="126" width="8" height="8" rx="1"/>
      <rect x="128" y="10" width="8" height="8" rx="1"/><rect x="128" y="30" width="8" height="8" rx="1"/><rect x="128" y="50" width="8" height="8" rx="1"/><rect x="128" y="70" width="8" height="8" rx="1"/><rect x="128" y="90" width="8" height="8" rx="1"/><rect x="128" y="110" width="8" height="8" rx="1"/><rect x="128" y="126" width="8" height="8" rx="1"/>
    </g>
    <!-- bitrate ladder -->
    <g transform="translate(24,104)">
      <rect x="0"  y="16" width="28" height="12" rx="2" fill="#bfdbfe"/>
      <rect x="34" y="8"  width="28" height="20" rx="2" fill="#60a5fa"/>
      <rect x="68" y="0"  width="28" height="28" rx="2" fill="#2563eb"/>
    </g>
  </g>

  <!-- text -->
  <text class="title" x="256" y="118">node-video-playground</text>
  <text class="sub"   x="256" y="152">Node.js recipes for video processing: probe, transcode, package, measure</text>

  <!-- tags -->
  <g transform="translate(256,182)">
    <rect width="96" height="28" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text class="tag" x="48" y="18" text-anchor="middle">TypeScript</text>
  </g>
  <g transform="translate(362,182)">
    <rect width="78" height="28" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text class="tag" x="39" y="18" text-anchor="middle">ffmpeg</text>
  </g>
  <g transform="translate(450,182)">
    <rect width="112" height="28" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text class="tag" x="56" y="18" text-anchor="middle">HLS · CMAF</text>
  </g>
  <g transform="translate(572,182)">
    <rect width="168" height="28" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text class="tag" x="84" y="18" text-anchor="middle">H.264 · H.265 · VP9</text>
  </g>

  <!-- footer line -->
  <line x1="256" y1="236" x2="1136" y2="236" stroke="#e5e7eb"/>
  <text class="lbl" x="256" y="258">Telecom / OTT backend examples</text>
  <text class="lbl" x="1136" y="258" text-anchor="end">github.com/vovadoma/node-video-playground</text>
</svg>
