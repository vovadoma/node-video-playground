<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="node-video-playground" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#151b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#be185d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <!-- film strip, left -->
  <g transform="translate(64,64)">
    <rect x="0" y="0" width="200" height="192" rx="16" fill="#0f172a" stroke="url(#accent)" stroke-width="2"/>
    <g fill="#1e293b">
      <rect x="12" y="14" width="18" height="12" rx="3"/><rect x="12" y="44" width="18" height="12" rx="3"/><rect x="12" y="74" width="18" height="12" rx="3"/><rect x="12" y="104" width="18" height="12" rx="3"/><rect x="12" y="134" width="18" height="12" rx="3"/><rect x="12" y="164" width="18" height="12" rx="3"/>
      <rect x="170" y="14" width="18" height="12" rx="3"/><rect x="170" y="44" width="18" height="12" rx="3"/><rect x="170" y="74" width="18" height="12" rx="3"/><rect x="170" y="104" width="18" height="12" rx="3"/><rect x="170" y="134" width="18" height="12" rx="3"/><rect x="170" y="164" width="18" height="12" rx="3"/>
    </g>
    <!-- play triangle -->
    <path d="M84 60 L84 132 L144 96 Z" fill="url(#accent)" filter="url(#glow)"/>
    <!-- bitrate ladder -->
    <g transform="translate(44,150)">
      <rect x="0" y="14" width="26" height="14" rx="3" fill="url(#bar3)"/>
      <rect x="34" y="6" width="26" height="22" rx="3" fill="url(#bar2)"/>
      <rect x="68" y="0" width="26" height="28" rx="3" fill="url(#bar1)"/>
    </g>
  </g>

  <!-- title -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="320" y="118" font-size="52" font-weight="700" fill="#f8fafc">node-video-playground</text>
    <text x="320" y="164" font-size="22" fill="#94a3b8">probe · transcode · package · measure — with Node.js and ffmpeg</text>
  </g>

  <!-- chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <g transform="translate(320,200)">
      <rect width="112" height="34" rx="17" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="56" y="22" text-anchor="middle" fill="#67e8f9">TypeScript</text>
    </g>
    <g transform="translate(444,200)">
      <rect width="88" height="34" rx="17" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="44" y="22" text-anchor="middle" fill="#c4b5fd">ffmpeg</text>
    </g>
    <g transform="translate(544,200)">
      <rect width="130" height="34" rx="17" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6" stroke-opacity="0.6"/>
      <text x="65" y="22" text-anchor="middle" fill="#f9a8d4">HLS · DASH</text>
    </g>
    <g transform="translate(686,200)">
      <rect width="204" height="34" rx="17" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.6"/>
      <text x="102" y="22" text-anchor="middle" fill="#6ee7b7">H.264 · H.265 · AV1</text>
    </g>
  </g>

  <!-- waveform bottom right -->
  <g transform="translate(900,258)" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M0 0 h8 M16 -6 v12 M32 -14 v28 M48 -8 v16 M64 -20 v40 M80 -10 v20 M96 -4 v8 M112 -16 v32 M128 -6 v12 M144 -22 v44 M160 -10 v20 M176 -3 v6 M192 -12 v24 M208 -6 v12 M224 0 h8"/>
  </g>
</svg>
