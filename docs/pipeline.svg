<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Pipeline: source → probe → transcode → package → measure" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .box { fill: #0f172a; stroke-width: 2; }
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .s { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .n { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #64748b; }
    .link { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="1000" height="200" rx="16" fill="#0b1020"/>

  <g transform="translate(30,50)">
    <rect class="box" width="150" height="100" rx="12" stroke="#94a3b8"/>
    <text class="t" x="75" y="42" text-anchor="middle">source</text>
    <text class="s" x="75" y="64" text-anchor="middle">MP4 · MOV · MXF</text>
    <text class="s" x="75" y="82" text-anchor="middle">TS · MKV · AVI …</text>
  </g>

  <path class="link" d="M180 100 H218"/>

  <g transform="translate(220,50)">
    <rect class="box" width="150" height="100" rx="12" stroke="#22d3ee"/>
    <text class="t" x="75" y="42" text-anchor="middle">probe</text>
    <text class="s" x="75" y="64" text-anchor="middle">codec, fps, bitrate</text>
    <text class="n" x="75" y="84" text-anchor="middle">01 · 06</text>
  </g>

  <path class="link" d="M370 100 H408"/>

  <g transform="translate(410,50)">
    <rect class="box" width="150" height="100" rx="12" stroke="#a78bfa"/>
    <text class="t" x="75" y="42" text-anchor="middle">transcode</text>
    <text class="s" x="75" y="64" text-anchor="middle">H.264 · H.265 · VP9</text>
    <text class="n" x="75" y="84" text-anchor="middle">02 · 03</text>
  </g>

  <path class="link" d="M560 100 H598"/>

  <g transform="translate(600,50)">
    <rect class="box" width="150" height="100" rx="12" stroke="#f472b6"/>
    <text class="t" x="75" y="42" text-anchor="middle">package</text>
    <text class="s" x="75" y="64" text-anchor="middle">HLS · CMAF · ABR</text>
    <text class="n" x="75" y="84" text-anchor="middle">04</text>
  </g>

  <path class="link" d="M750 100 H788"/>

  <g transform="translate(790,50)">
    <rect class="box" width="180" height="100" rx="12" stroke="#34d399"/>
    <text class="t" x="90" y="42" text-anchor="middle">measure</text>
    <text class="s" x="90" y="64" text-anchor="middle">PSNR · SSIM · VMAF</text>
    <text class="n" x="90" y="84" text-anchor="middle">05</text>
  </g>
</svg>
